[package]
name = "i18n-dict-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "i18n-dict 的过程宏:dictkey 属性宏、DictKey/DictKeyDeserialize derive 与 subset! 子集宏"
keywords = ["i18n", "dictionary", "macros", "proc-macro"]
categories = ["internationalization"]
readme = "../README.md"

[lib]
proc-macro = true
[dependencies]
proc-macro2 = { workspace = true, features = ["proc-macro"] }
quote = { workspace = true, features = ["proc-macro"] }
syn = { workspace = true, features = ["clone-impls", "derive", "parsing", "printing", "proc-macro"] }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# 测试中宏展开引用 ::i18n_dict::DictKey trait(dev-dependency 循环是允许的)
i18n-dict = { path = "../i18n-dict" }